name: Godot Web phase A
on:
  push:
    branches: ['arena/2b071717-mergeanimal']
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Godot, Web templates and browsers
        shell: bash
        run: |
          set -e -o pipefail
          mkdir -p /tmp/web-qa
          exec > >(tee /tmp/web-qa/install.log) 2>&1
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          npm ci --prefix MergeAnimals/tests/web
          cd MergeAnimals/tests/web && npx playwright install --with-deps chromium firefox
      - name: Export and browser smoke over local HTTP
        run: |
          set -e -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p /tmp/web-test /tmp/web-qa
          "$GODOT" --headless --path MergeAnimals --editor --quit > /tmp/web-qa/export.log 2>&1
          "$GODOT" --headless --path MergeAnimals --export-release 'Web (single-threaded)' /tmp/web-test/index.html >> /tmp/web-qa/export.log 2>&1
          ls -l /tmp/web-test | tee /tmp/web-qa/files.log
          grep -E 'GODOT_THREADS_ENABLED *= *false' /tmp/web-test/index.html | head -1 | tee /tmp/web-qa/threads.log
          python3 -m http.server 8765 --directory /tmp/web-test >/tmp/web-qa/server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          WEB_URL=http://127.0.0.1:8765/ WEB_QA_DIR=/tmp/web-qa LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1920x1400x24' npm test --prefix MergeAnimals/tests/web 2>&1 | tee /tmp/web-qa/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-phase-a
          path: |
            /tmp/web-test
            /tmp/web-qa/*.log
            /tmp/web-qa/*-events.json
            /tmp/web-qa/*.png
          if-no-files-found: warn
      - name: Publish diagnostic and screenshot previews
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/web-qa');p=pathlib.Path('/tmp/web-check.json')
          def post(name,text):
              p.write_text(json.dumps({'name':name,'head_sha':os.environ['SHA'],'status':'completed','conclusion':'neutral','output':{'title':name,'summary':'Phase A web test; scripted browser smoke, not human play','text':text}}))
              subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['REPO']}/check-runs",'--input',str(p)],check=True,stdout=subprocess.DEVNULL)
          text='\n'.join('=== '+f.name+' ===\n'+f.read_text(errors='replace') for f in sorted(root.glob('*.log')))
          post('Web phase A diagnostic',text[-55000:] or 'No logs')
          for f in sorted(root.glob('*.png')):
              jpg=pathlib.Path('/tmp')/(f.stem+'.jpg')
              subprocess.run(['convert',str(f),'-resize','360x640>','-quality','70',str(jpg)],check=True)
              encoded=base64.b64encode(jpg.read_bytes()).decode()
              for i in range(0,len(encoded),48000):
                  post('Web screenshot %s %03d of %03d' %(f.stem,i//48000+1,(len(encoded)+47999)//48000),encoded[i:i+48000])
          PY
