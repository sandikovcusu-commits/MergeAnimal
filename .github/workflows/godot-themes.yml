name: Godot Theme integration
on:
  push:
    branches: ['arena/2b071717-mergeanimal']
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Godot test and separate-process restore
        run: |
          set -e -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path MergeAnimals --editor --quit > /tmp/theme-log.txt 2>&1
          mkdir -p /tmp/theme-user
          XDG_DATA_HOME=/tmp/theme-user timeout 120s "$GODOT" --headless --path MergeAnimals --fixed-fps 60 --script res://tests/integration/day650_theme.gd 2>&1 | tee -a /tmp/theme-log.txt
          XDG_DATA_HOME=/tmp/theme-user THEME_PHASE=read timeout 120s "$GODOT" --headless --path MergeAnimals --fixed-fps 60 --script res://tests/integration/day650_theme.gd 2>&1 | tee -a /tmp/theme-log.txt
          if grep -iE 'SCRIPT ERROR|Parse Error|ERROR:|^FAIL' /tmp/theme-log.txt; then exit 1; fi
      - name: Publish diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          log=pathlib.Path('/tmp/theme-log.txt')
          p=pathlib.Path('/tmp/theme-check.json')
          p.write_text(json.dumps({'name':'Theme diagnostic','head_sha':os.environ['SHA'],'status':'completed','conclusion':'neutral','output':{'title':'Theme diagnostic','summary':'Real Godot; save migration fixtures','text':log.read_text(errors='replace')[-55000:] if log.exists() else 'No log'}}))
          subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['REPO']}/check-runs",'--input',str(p)],check=True,stdout=subprocess.DEVNULL)
          PY
