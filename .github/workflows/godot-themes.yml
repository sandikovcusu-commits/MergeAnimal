name: Godot Theme integration
on:
  push:
    branches: ['arena/2b071717-mergeanimal']
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and X11
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick xdotool
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Godot test and separate-process restore
        run: |
          set -e -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path MergeAnimals --editor --quit > /tmp/theme-log.txt 2>&1
          mkdir -p /tmp/theme-user
          XDG_DATA_HOME=/tmp/theme-user timeout 120s "$GODOT" --headless --path MergeAnimals --fixed-fps 60 --script res://tests/integration/day650_theme.gd 2>&1 | tee -a /tmp/theme-log.txt
          XDG_DATA_HOME=/tmp/theme-user THEME_PHASE=read timeout 120s "$GODOT" --headless --path MergeAnimals --fixed-fps 60 --script res://tests/integration/day650_theme.gd 2>&1 | tee -a /tmp/theme-log.txt
          mkdir -p /tmp/locale-user
          XDG_DATA_HOME=/tmp/locale-user timeout 120s "$GODOT" --headless --path MergeAnimals --fixed-fps 60 --script res://tests/integration/day650_localization.gd 2>&1 | tee -a /tmp/theme-log.txt
          if grep -iE 'SCRIPT ERROR|Parse Error|ERROR:|^FAIL' /tmp/theme-log.txt; then exit 1; fi
      - name: Capture three themes and four locales at three sizes
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CAPTURE_DIR: /tmp/theme-captures
        run: |
          set -e -o pipefail
          mkdir -p "$CAPTURE_DIR"
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          for spec in '360 640' '720 1280' '1366 768'; do
            set -- $spec
            XDG_DATA_HOME="/tmp/theme-visual-$1" CAPTURE_PREFIX="$1x$2" CAPTURE_WIDTH="$1" CAPTURE_HEIGHT="$2" xvfb-run -a -s '-screen 0 1920x1400x24' timeout 180s "$GODOT" --path MergeAnimals --audio-driver Dummy --rendering-method gl_compatibility --resolution "$1"x"$2" --script res://tests/integration/day650_visual.gd 2>&1 | tee -a /tmp/theme-log.txt
          done
          if grep -iE 'SCRIPT ERROR|Parse Error|ERROR:|^FAIL' /tmp/theme-log.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-locale-windows
          path: /tmp/theme-captures/*.png
          if-no-files-found: warn
      - name: Publish diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          log=pathlib.Path('/tmp/theme-log.txt')
          p=pathlib.Path('/tmp/theme-check.json')
          p.write_text(json.dumps({'name':'Theme diagnostic','head_sha':os.environ['SHA'],'status':'completed','conclusion':'neutral','output':{'title':'Theme diagnostic','summary':'Real Godot; save migration fixtures','text':log.read_text(errors='replace')[-55000:] if log.exists() else 'No log'}}))
          subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['REPO']}/check-runs",'--input',str(p)],check=True,stdout=subprocess.DEVNULL)
          import base64,zipfile
          archive=pathlib.Path('/tmp/themes-full.zip')
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for f in sorted(pathlib.Path('/tmp/theme-captures').glob('*.png')):
                  jpg=pathlib.Path('/tmp')/('full-'+f.stem+'.jpg')
                  subprocess.run(['convert',str(f),'-quality','75',str(jpg)],check=True)
                  z.write(jpg,f.stem+'.jpg')
          encoded=base64.b64encode(archive.read_bytes()).decode()
          chunks=[encoded[i:i+48000] for i in range(0,len(encoded),48000)]
          for i,chunk in enumerate(chunks):
              name='Theme full-resolution archive %03d of %03d' % (i+1,len(chunks))
              p.write_text(json.dumps({'name':name,'head_sha':os.environ['SHA'],'status':'completed','conclusion':'neutral','output':{'title':name,'summary':'X11 seeded fixtures archive','text':chunk}}))
              subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['REPO']}/check-runs",'--input',str(p)],check=True,stdout=subprocess.DEVNULL)
          PY
