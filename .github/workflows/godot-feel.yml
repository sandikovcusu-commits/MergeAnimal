name: Godot V0.7 Game Feel
on:
  push:
    branches: ['arena/2b071717-mergeanimal']
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  feel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and X11
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick xdotool
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Real Godot animation and audio integration
        run: |
          set -e -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path MergeAnimals --editor --quit > /tmp/feel-log.txt 2>&1
          mkdir -p /tmp/feel-user
          XDG_DATA_HOME=/tmp/feel-user timeout 120s "$GODOT" --headless --path MergeAnimals --fixed-fps 60 --script res://tests/integration/day700_feel.gd 2>&1 | tee -a /tmp/feel-log.txt
          if grep -iE 'SCRIPT ERROR|Parse Error|ERROR:|^FAIL' /tmp/feel-log.txt; then exit 1; fi
      - name: X11 gameplay and logo screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CAPTURE_DIR: /tmp/feel-captures
        run: |
          set -e -o pipefail
          mkdir -p "$CAPTURE_DIR"
          XDG_DATA_HOME=/tmp/feel-visual xvfb-run -a -s '-screen 0 1920x1400x24' timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --path MergeAnimals --audio-driver Dummy --rendering-method gl_compatibility --resolution 720x1280 --script res://tests/integration/day700_visual.gd 2>&1 | tee -a /tmp/feel-log.txt
          if grep -iE 'SCRIPT ERROR|Parse Error|ERROR:|^FAIL' /tmp/feel-log.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feel-windows
          path: /tmp/feel-captures/*.png
          if-no-files-found: warn
      - name: Publish diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          p=pathlib.Path('/tmp/feel-check.json'); log=pathlib.Path('/tmp/feel-log.txt')
          p.write_text(json.dumps({'name':'Game Feel diagnostic','head_sha':os.environ['SHA'],'status':'completed','conclusion':'neutral','output':{'title':'Game Feel diagnostic','summary':'Godot engine, headless dummy audio; not a listening test','text':log.read_text(errors='replace')[-55000:] if log.exists() else 'No log'}}))
          subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['REPO']}/check-runs",'--input',str(p)],check=True,stdout=subprocess.DEVNULL)
          import base64
          for f in sorted(pathlib.Path('/tmp/feel-captures').glob('*.png')):
              jpg=pathlib.Path('/tmp')/(f.stem+'.jpg')
              subprocess.run(['convert',str(f),'-quality','78',str(jpg)],check=True)
              encoded=base64.b64encode(jpg.read_bytes()).decode()
              for i in range(0,len(encoded),48000):
                  part=i//48000+1; total=(len(encoded)+47999)//48000
                  name='Feel screenshot %s %03d of %03d' % (f.stem,part,total)
                  p.write_text(json.dumps({'name':name,'head_sha':os.environ['SHA'],'status':'completed','conclusion':'neutral','output':{'title':name,'summary':'X11 scripted fixture; not a human playtest','text':encoded[i:i+48000]}}))
                  subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['REPO']}/check-runs",'--input',str(p)],check=True,stdout=subprocess.DEVNULL)
          PY
