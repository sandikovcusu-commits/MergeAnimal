name: Godot runtime tests
on:
  push:
    branches:
      - 'arena/2b071717-mergeanimal'
  workflow_dispatch:
    inputs:
      physics_compare:
        description: Run six matched 100-seed CCD comparison jobs
        type: boolean
        default: false
      full_bots:
        description: Run 100 sessions at each tick rate (slow)
        type: boolean
        default: false
      merge_probe:
        description: 'Dense merge fixture expectation: none, baseline or fixed'
        default: 'none'
      save_retry_a3:
        description: Run A.3 terminal local save retry and stale callback fixture
        type: boolean
        default: false
      placement_a3:
        description: Run A.3 bounded placement and danger integrity fixture
        type: boolean
        default: false
      trace_compare:
        description: Compare approximate old Firefox trace against exact baseline scripts
        type: boolean
        default: false
      merge_stress:
        description: Run synthetic 100 seed merge stress at 10, 20 and 40 bodies
        type: boolean
        default: false
      contact_retry_a4:
        description: Run A.4 automatic contact retry fixture
        type: boolean
        default: false
      merge_stress_a4:
        description: Run A.4 synthetic stress with automatic contact retry
        type: boolean
        default: false
permissions:
  contents: write
  checks: write
jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo /tmp/godot >> "$GITHUB_PATH"
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Run Godot tests
        id: tests
        shell: bash
        run: |
          set +e
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          : > /tmp/godot-test-log.txt
          status=0
          run_test() {
            echo "===== $1 =====" | tee -a /tmp/godot-test-log.txt
            limit=120
            if [[ "$1" == 'bot sessions '* ]]; then limit=1200; fi
            shift
            timeout "$limit" "$GODOT" --headless --path MergeAnimals "$@" >> /tmp/godot-test-log.txt 2>&1
            code=$?
            echo "exit=$code" | tee -a /tmp/godot-test-log.txt
            if [ "$code" -ne 0 ]; then status=1; fi
          }
          # Godot 4.7.2 headless import intermittently aborts with glibc heap
          # corruption after a successful reimport (see A.4 report). One clean
          # retry is a CI reliability measure, not a product result.
          if ! timeout 300 "$GODOT" --headless --path MergeAnimals --editor --quit >> /tmp/godot-test-log.txt 2>&1; then
            echo 'editor import attempt 1 failed; clean retry' | tee -a /tmp/godot-test-log.txt
            rm -rf MergeAnimals/.godot
            timeout 300 "$GODOT" --headless --path MergeAnimals --editor --quit >> /tmp/godot-test-log.txt 2>&1
            code=$?
            echo "exit=$code" | tee -a /tmp/godot-test-log.txt
            if [ "$code" -ne 0 ]; then status=1; fi
          fi
          run_test 'integration' --script res://tests/integration/day2_suite.gd
          run_test 'character expression frames' --script res://tests/integration/expression_frames.gd
          run_test 'visual scheduler lifecycle' --fixed-fps 60 --script res://tests/integration/visual_scheduler.gd
          run_test 'day6 save primitive' --script res://tests/integration/day6_save_primitive.gd
          run_test 'day63 reward gateway' --script res://tests/integration/day63_reward_gateway.gd
          mkdir -p /tmp/day61-runtime-user
          export XDG_DATA_HOME=/tmp/day61-runtime-user
          SESSION_PHASE=write run_test 'day61 session write process' --fixed-fps 60 --script res://tests/integration/day61_session_process.gd
          SESSION_PHASE=read run_test 'day61 session read process' --fixed-fps 60 --script res://tests/integration/day61_session_process.gd
          unset XDG_DATA_HOME
          mkdir -p /tmp/day62-runtime-user
          XDG_DATA_HOME=/tmp/day62-runtime-user run_test 'day62 collection integration' --fixed-fps 60 --script res://tests/integration/day62_collection.gd
          run_test 'day5 tutorial collision' --script res://tests/integration/day5_tutorial.gd
          run_test 'day5 effects' --script res://tests/integration/day5_effects.gd
          run_test 'day803 performance regression' --script res://tests/integration/day803_performance.gd
          run_test 'day5 GUI input' --script res://tests/integration/day5_input.gd
          run_test 'day5 UI interaction' --script res://tests/integration/day5_ui.gd
          run_test 'day4.1 UI assets' --script res://tests/integration/day41_ui_assets.gd
          run_test 'day4 assets' --script res://tests/integration/day4_assets.gd
          run_test 'day3 evolution' --script res://tests/integration/day3_suite.gd
          run_test 'natural collision' --script res://tests/physics/natural_collision.gd
          run_test 'input recovery' --script res://tests/integration/input_recovery.gd
          run_test 'multitouch' --script res://tests/integration/input_multitouch.gd
          run_test 'restart' --script res://tests/integration/restart.gd
          run_test 'contact chain' --script res://tests/physics/chain_contact.gd
          run_test 'wall matrix' --fixed-fps 60 --script res://tests/physics/day3_wall_matrix.gd
          BOT_SESSIONS=4
          if [ "${{ inputs.full_bots }}" = "true" ]; then BOT_SESSIONS=100; fi
          export BOT_SESSIONS
          BOT_TICKS=60 run_test 'bot sessions 60Hz' --fixed-fps 60 --script res://tests/physics/bot_sessions.gd
          BOT_TICKS=120 run_test 'bot sessions 120Hz' --fixed-fps 60 --script res://tests/physics/bot_sessions.gd
          run_test 'wall collision' --script res://tests/physics/wall_collision.gd
          run_test 'real gameplay' --script res://tests/physics/real_gameplay.gd
          run_test '100 drops' --script res://tests/physics/drop_100.gd
          run_test 'stress' --script res://tests/physics/stress.gd
          if [[ "${{ inputs.merge_probe }}" == 'baseline' || "${{ inputs.merge_probe }}" == 'fixed' ]]; then
            mkdir -p /tmp/merge-probe-user
            MERGE_EXPECT='${{ inputs.merge_probe }}' XDG_DATA_HOME=/tmp/merge-probe-user run_test 'dense merge deadlock fixture' --fixed-fps 60 --script res://tests/integration/merge_deadlock_fixture.gd
          fi
          if [[ "${{ inputs.merge_stress }}" == 'true' ]]; then
            run_test 'merge stress 100 seeds' --fixed-fps 60 --script res://tests/integration/merge_stress.gd
          fi
          if [[ "${{ inputs.save_retry_a3 }}" == 'true' ]]; then
            mkdir -p /tmp/save-retry-a3-user
            XDG_DATA_HOME=/tmp/save-retry-a3-user run_test 'terminal save retry a3' --fixed-fps 60 --script res://tests/integration/save_retry_a3.gd
          fi
          if [[ "${{ inputs.placement_a3 }}" == 'true' ]]; then
            mkdir -p /tmp/placement-a3-user
            XDG_DATA_HOME=/tmp/placement-a3-user run_test 'placement a3' --fixed-fps 60 --script res://tests/integration/placement_a3.gd
            TRACE_EXPECT=a3 run_test 'Firefox trace approximate a3' --fixed-fps 60 --script res://tests/integration/merge_trace_reconstruction.gd
          fi
          if [[ "${{ inputs.contact_retry_a4 }}" == 'true' ]]; then
            mkdir -p /tmp/contact-retry-a4-user
            XDG_DATA_HOME=/tmp/contact-retry-a4-user run_test 'contact retry a4' --fixed-fps 60 --script res://tests/integration/contact_retry_a4.gd
          fi
          if [[ "${{ inputs.merge_stress_a4 }}" == 'true' ]]; then
            run_test 'merge stress a4 100 seeds' --fixed-fps 60 --script res://tests/integration/merge_stress_a4.gd
          fi
          if [[ "${{ inputs.trace_compare }}" == 'true' ]]; then
            TRACE_EXPECT=fixed run_test 'Firefox trace approximate fixed' --fixed-fps 60 --script res://tests/integration/merge_trace_reconstruction.gd
            git fetch --depth=1 origin 5285aa036331a12ebf97f5c78024ceaf2a5f1d0a
            cp -a MergeAnimals /tmp/old-trace-project
            git show 5285aa036331a12ebf97f5c78024ceaf2a5f1d0a:MergeAnimals/scripts/gameplay/Game.gd > /tmp/old-trace-project/scripts/gameplay/Game.gd
            git show 5285aa036331a12ebf97f5c78024ceaf2a5f1d0a:MergeAnimals/scripts/managers/MergeManager.gd > /tmp/old-trace-project/scripts/managers/MergeManager.gd
            echo '===== Firefox trace approximate baseline =====' | tee -a /tmp/godot-test-log.txt
            TRACE_EXPECT=baseline timeout 120 "$GODOT" --headless --path /tmp/old-trace-project --fixed-fps 60 --script res://tests/integration/merge_trace_reconstruction.gd >> /tmp/godot-test-log.txt 2>&1
            code=$?; echo "exit=$code" | tee -a /tmp/godot-test-log.txt
            if [ "$code" -ne 0 ]; then status=1; fi
          fi
          cat /tmp/godot-test-log.txt
          if grep -iE 'SCRIPT ERROR|Parse Error|ERROR:|Invalid Resource|Missing Texture|Missing experimental sprite|Invalid Method Call|Failed Scene Load|^FAIL([ :]|$)' /tmp/godot-test-log.txt; then status=1; fi
          echo "$status" > /tmp/godot-test-status
          exit "$status"
      - name: Report incomplete release acceptance (separate from DEV regression)
        if: always()
        shell: bash
        run: |
          set +e
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path MergeAnimals --script res://tests/integration/day41_acceptance.gd 2>&1 | tee /tmp/godot-acceptance-log.txt
          result=${PIPESTATUS[0]}
          if grep -iE 'SCRIPT ERROR|Parse Error|ERROR:|Invalid Resource|Missing Texture|Invalid Method Call|Failed Scene Load' /tmp/godot-acceptance-log.txt; then exit 1; fi
          if [ "$result" -ne 1 ] || ! grep -q 'Acceptance missing or blocked:' /tmp/godot-acceptance-log.txt; then
            echo "Unexpected acceptance test execution result: $result"; exit 1
          fi
          echo '::warning::Release acceptance is NOT MET; missing states and unverified licensing. See acceptance log.'
      - name: Publish diagnostic check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('/tmp/godot-test-log.txt')
          text = p.read_text(errors='replace')[-50000:] if p.exists() else 'No test log; installation or checkout failed.'
          acceptance = pathlib.Path('/tmp/godot-acceptance-log.txt')
          text += '\n===== SEPARATE RELEASE ACCEPTANCE (not DEV regression) =====\n' + (acceptance.read_text(errors='replace') if acceptance.exists() else 'not executed')
          status = pathlib.Path('/tmp/godot-test-status')
          result = 'success' if status.exists() and status.read_text().strip() == '0' else 'failure'
          payload = {'name':'Godot runtime diagnostic', 'head_sha':os.environ['SHA'], 'status':'completed', 'conclusion':result,
                     'output':{'title':'Godot 4.7.2 headless tests', 'summary':'Runtime test log; see Actions run for full details.', 'text':text}}
          pathlib.Path('/tmp/check.json').write_text(json.dumps(payload))
          PY
          gh api --method POST "repos/$REPO/check-runs" --input /tmp/check.json > /dev/null
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-log
          path: |
            /tmp/godot-test-log.txt
            /tmp/godot-acceptance-log.txt
          if-no-files-found: warn
      - name: Transport native test log as temporary Git blob
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e -o pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,zipfile
          archive=pathlib.Path('/tmp/native-evidence.zip')
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name in ['godot-test-log.txt','godot-acceptance-log.txt']:
                  path=pathlib.Path('/tmp')/name
                  if path.exists(): z.write(path,name)
          payload=pathlib.Path('/tmp/native-blob.json')
          payload.write_text(json.dumps({'content':base64.b64encode(archive.read_bytes()).decode(),'encoding':'base64'}))
          result=subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['REPO']}/git/blobs",'--input',str(payload),'--jq','.sha'],check=True,text=True,stdout=subprocess.PIPE).stdout.strip()
          print('::notice::NATIVE_EVIDENCE blob_sha=%s sha256=%s bytes=%d' % (result,hashlib.sha256(archive.read_bytes()).hexdigest(),archive.stat().st_size), flush=True)
          PY

  physics_compare:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.physics_compare }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tick: [60, 90, 120]
        mode: [baseline, shape-ccd, predictive-floor, predictive-bounds]
        exclude:
          - {tick: 60, mode: predictive-floor}
          - {tick: 90, mode: predictive-floor}
          - {tick: 60, mode: predictive-bounds}
          - {tick: 90, mode: predictive-bounds}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Run same automated 100-seed baseline and experiment
        env:
          TICK: ${{ matrix.tick }}
          MODE: ${{ matrix.mode }}
        run: |
          set -e -o pipefail
          git fetch --no-tags --depth=1 origin b79dd4d0fe00ecd1a1215bc70db6266fa4cbab4e
          mkdir -p /tmp/physics /tmp/physics-results
          git archive b79dd4d0fe00ecd1a1215bc70db6266fa4cbab4e MergeAnimals | tar -x -C /tmp/physics
          if [ "$MODE" = shape-ccd ]; then sed -i 's/^continuous_cd = 1$/continuous_cd = 2/' /tmp/physics/MergeAnimals/scenes/animals/Animal.tscn; fi
          if [ "$MODE" = predictive-floor ]; then python3 MergeAnimals/tests/physics/apply_floor_guard.py /tmp/physics/MergeAnimals; fi
          if [ "$MODE" = predictive-bounds ]; then python3 MergeAnimals/tests/physics/apply_floor_guard.py /tmp/physics/MergeAnimals bounds; fi
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path /tmp/physics/MergeAnimals --editor --quit > /tmp/physics-results/import.log 2>&1
          /usr/bin/time -v -o /tmp/physics-results/time.txt env BOT_SESSIONS=100 BOT_TICKS="$TICK" "$GODOT" --headless --fixed-fps 60 --path /tmp/physics/MergeAnimals --script res://tests/physics/bot_sessions.gd > /tmp/physics-results/bots.log 2>&1
          grep '^BOT_' /tmp/physics-results/bots.log > /tmp/physics-results/bot-output.txt
          grep -q "BOT_COMPLETE sessions=100 ticks=$TICK" /tmp/physics-results/bot-output.txt
          if [ "$TICK" = 120 ]; then
            cp MergeAnimals/tests/physics/physics_diagnostics.gd /tmp/physics/MergeAnimals/tests/physics/physics_diagnostics.gd
            "$GODOT" --headless --fixed-fps 60 --path /tmp/physics/MergeAnimals --script res://tests/physics/physics_diagnostics.gd > /tmp/physics-results/diagnostics.log 2>&1
            grep -q '^PHYSICS_DIAGNOSTICS complete' /tmp/physics-results/diagnostics.log
          fi
          python3 - <<'PY'
          import csv,os,pathlib
          p=pathlib.Path('/tmp/physics-results/bot-output.txt')
          rows=[x[len('BOT_CSV '):] for x in p.read_text().splitlines() if x.startswith('BOT_CSV ')]
          assert len(rows)==101,len(rows)
          with open('/tmp/physics-results/results.csv','w') as f:f.write('\n'.join(rows)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-${{ matrix.mode }}-${{ matrix.tick }}
          path: /tmp/physics-results
      - name: Preserve logs as Git blob and checks annotation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,zipfile
          p=pathlib.Path('/tmp/physics-evidence.zip')
          with zipfile.ZipFile(p,'w',zipfile.ZIP_DEFLATED) as z:
            for f in pathlib.Path('/tmp/physics-results').glob('*'):
              if f.is_file():z.write(f,f.name)
          j=pathlib.Path('/tmp/blob.json');j.write_text(json.dumps({'content':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'}))
          sha=subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['REPO']}/git/blobs",'--input',str(j),'--jq','.sha'],check=True,capture_output=True,text=True).stdout.strip()
          print('::notice::PHYSICS_EVIDENCE blob_sha=%s sha256=%s bytes=%s'%(sha,hashlib.sha256(p.read_bytes()).hexdigest(),p.stat().st_size))
          PY
