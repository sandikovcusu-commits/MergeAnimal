name: Godot software render
on:
  push:
    branches: ['arena/2b071717-mergeanimal']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Xvfb and official Godot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Import and render
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CAPTURE_DIR: /tmp/godot-renders
        run: |
          mkdir -p "$CAPTURE_DIR"
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path MergeAnimals --editor --quit
          xvfb-run -a -s '-screen 0 1920x1920x24' "$GODOT" --path MergeAnimals --rendering-method gl_compatibility --script res://tests/integration/render_capture.gd
          ls -l "$CAPTURE_DIR"
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-renders
          path: /tmp/godot-renders/*.png
          if-no-files-found: warn
