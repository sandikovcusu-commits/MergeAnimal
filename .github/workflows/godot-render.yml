name: Godot software render
on:
  push:
    branches: ['arena/2b071717-mergeanimal']
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Xvfb and official Godot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Import and render
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CAPTURE_DIR: /tmp/godot-renders
        run: |
          mkdir -p "$CAPTURE_DIR"
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path MergeAnimals --editor --quit
          xvfb-run -a -s '-screen 0 1920x1920x24' "$GODOT" --path MergeAnimals --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/integration/render_capture.gd 2>&1 | tee /tmp/render-log.txt
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|^FAIL' /tmp/render-log.txt; then exit 1; fi
          ls -l "$CAPTURE_DIR"
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-renders
          path: /tmp/godot-renders/*.png
          if-no-files-found: warn
      - name: Publish render inspection thumbnails
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, json, os, pathlib, subprocess
          files = sorted(pathlib.Path('/tmp/godot-renders').glob('*.png'))
          for f in files:
              thumb = pathlib.Path('/tmp') / (f.stem + '.jpg')
              subprocess.run(['convert', str(f), '-resize', '360x640>', '-quality', '45', str(thumb)], check=True)
              info = subprocess.check_output(['identify', '-format', '%wx%h', str(f)], text=True)
              encoded = base64.b64encode(thumb.read_bytes()).decode()
              if len(encoded) > 60000:
                  raise RuntimeError('inspection thumbnail too large for checks API')
              payload = {'name': 'Render inspection ' + f.stem, 'head_sha': os.environ['SHA'], 'status': 'completed', 'conclusion': 'success',
                         'output': {'title': 'Software renderer thumbnail', 'summary': f'Original viewport image size: {info}; thumbnail is a JPEG for inspection only.', 'text': encoded}}
              p = pathlib.Path('/tmp/render-check.json')
              p.write_text(json.dumps(payload))
              subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['REPO']}/check-runs",'--input',str(p)], check=True, stdout=subprocess.DEVNULL)
          PYCODE
      - name: Publish render log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          log = pathlib.Path('/tmp/render-log.txt')
          data = log.read_text(errors='replace')[-45000:] if log.exists() else 'render log unavailable'
          payload = {'name':'Godot software render diagnostic','head_sha':os.environ['SHA'],'status':'completed','conclusion':'neutral', 'output':{'title':'Render log','summary':'Render script output','text':data}}
          pathlib.Path('/tmp/render-diag.json').write_text(json.dumps(payload))
          subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['REPO']}/check-runs",'--input','/tmp/render-diag.json'], check=True, stdout=subprocess.DEVNULL)
          PYCODE
