name: Godot Remove integration and X11
on:
  push:
    branches: ['arena/2b071717-mergeanimal']
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and X11
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick xdotool
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Real Godot tests and capture
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CAPTURE_DIR: /tmp/remove-captures
        run: |
          set -e -o pipefail
          mkdir -p "$CAPTURE_DIR" /tmp/remove-test-user /tmp/remove-two-user /tmp/remove-visual-user
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path MergeAnimals --editor --quit > /tmp/remove-log.txt 2>&1
          XDG_DATA_HOME=/tmp/remove-test-user timeout 120s "$GODOT" --headless --path MergeAnimals --fixed-fps 60 --script res://tests/integration/day631_remove.gd 2>&1 | tee -a /tmp/remove-log.txt
          XDG_DATA_HOME=/tmp/remove-two-user REMOVE_PHASE=write timeout 120s "$GODOT" --headless --path MergeAnimals --fixed-fps 60 --script res://tests/integration/day631_remove.gd 2>&1 | tee -a /tmp/remove-log.txt
          XDG_DATA_HOME=/tmp/remove-two-user REMOVE_PHASE=read timeout 120s "$GODOT" --headless --path MergeAnimals --fixed-fps 60 --script res://tests/integration/day631_remove.gd 2>&1 | tee -a /tmp/remove-log.txt
          XDG_DATA_HOME=/tmp/remove-visual-user xvfb-run -a -s '-screen 0 1280x1400x24' timeout 120s "$GODOT" --path MergeAnimals --audio-driver Dummy --rendering-method gl_compatibility --resolution 720x1280 --script res://tests/integration/day631_visual.gd 2>&1 | tee -a /tmp/remove-log.txt
          if grep -iE 'SCRIPT ERROR|Parse Error|ERROR:|^FAIL' /tmp/remove-log.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remove-windows
          path: /tmp/remove-captures/*.png
          if-no-files-found: warn
      - name: Publish diagnostics and thumbnails
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess
          def post(name,text):
              p=pathlib.Path('/tmp/remove-check.json')
              p.write_text(json.dumps({'name':name,'head_sha':os.environ['SHA'],'status':'completed','conclusion':'neutral','output':{'title':name,'summary':'Automated seeded fixture; not human playtesting','text':text}}))
              subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['REPO']}/check-runs",'--input',str(p)],check=True,stdout=subprocess.DEVNULL)
          log=pathlib.Path('/tmp/remove-log.txt')
          post('Remove diagnostic',log.read_text(errors='replace')[-50000:] if log.exists() else 'No log')
          for f in sorted(pathlib.Path('/tmp/remove-captures').glob('*.png')):
              thumb=pathlib.Path('/tmp')/(f.stem+'.jpg')
              subprocess.run(['convert',str(f),'-resize','360x640>','-quality','60',str(thumb)],check=True)
              post('Remove capture '+f.stem,base64.b64encode(thumb.read_bytes()).decode())
          PY
